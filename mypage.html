<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>マイページ - EduMarket</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <nav class="site-nav">

        <a href="index.html">
            EduMarket
        </a>

        <a href="materials.html">
            教材を探す
        </a>

        <a href="mypage.html">
            マイページ
        </a>

    </nav>


    <header>

        <h1>EduMarket</h1>

        <p>
            先生が作った教材を、必要な人へ。
        </p>

    </header>


   <main class="mypage-main">


    <h2 class="mypage-title">
        マイページ
    </h2>


  <!-- プロフィール -->

<section class="profile-card">

    <div
        id="user-info"
        class="profile-info"
    >

        <p>
            ユーザー情報を読み込んでいます...
        </p>

    </div>


    <a
        href="profile-edit.html"
        class="profile-edit-button"
    >
        プロフィールを編集
    </a>

</section>



<!-- メインメニュー -->

<div class="mypage-dashboard">

    <!-- 出品した教材 -->

    <a
        href="my-materials.html"
        class="mypage-menu-card"
    >

        <div class="menu-icon">
            📚
        </div>

        <div class="menu-content">

            <h2>
                自分が出品した教材
            </h2>

            <p>
                出品した教材を確認・管理
            </p>

        </div>

        <div class="menu-arrow">
            ›
        </div>

    </a>


    <!-- 購入した教材 -->

    <a
        href="purchases.html"
        class="mypage-menu-card"
    >

        <div class="menu-icon">
            🛒
        </div>

        <div class="menu-content">

            <h2>
                購入した教材
            </h2>

            <p>
                購入した教材を確認
            </p>

        </div>

        <div class="menu-arrow">
            ›
        </div>

    </a>


    <!-- 売上管理 -->

    <a
        href="sales.html"
        class="mypage-menu-card"
    >

        <div class="menu-icon">
            📊
        </div>

        <div class="menu-content">

            <h2>
                売上管理
            </h2>

            <p>
                売上・販売状況を確認
            </p>

        </div>

        <div class="menu-arrow">
            ›
        </div>

    </a>


    <!-- 販売履歴 -->

    <a
        href="sales-history.html"
        class="mypage-menu-card"
    >

        <div class="menu-icon">
            📋
        </div>

        <div class="menu-content">

            <h2>
                販売履歴
            </h2>

            <p>
                これまでの販売履歴を確認
            </p>

        </div>

        <div class="menu-arrow">
            ›
        </div>

    </a>

</div>


    <!-- Stripe -->

    <section class="stripe-card">

        <div class="stripe-title">

            <div class="dashboard-icon">
                💳
            </div>

            <div>

                <h2>
                    Stripe販売者登録
                </h2>

                <p>
                    教材を販売するにはStripeの販売者登録が必要です
                </p>

            </div>

        </div>


        <button
            id="stripe-connect-button"
            class="stripe-button"
        >
            Stripeを設定する
        </button>

    </section>


    <!-- アカウント -->

    <section class="account-card">

        <h2>
            アカウント
        </h2>


        <button
            id="logout-button"
            class="logout-button"
        >

            ログアウト

        </button>

    </section>


</main>


    <!-- 下部ナビ -->

    <nav class="bottom-nav">

        <a
            href="index.html"
            class="nav-item"
        >
            <span class="nav-icon">⌂</span>
            <span>ホーム</span>
        </a>


        <a
            href="materials.html"
            class="nav-item"
        >
            <span class="nav-icon">⌕</span>
            <span>探す</span>
        </a>


        <a
            href="sell.html"
            class="nav-item"
        >
            <span class="nav-icon">＋</span>
            <span>出品</span>
        </a>


        <a
            href="purchases.html"
            class="nav-item"
        >
            <span class="nav-icon">🛒</span>
            <span>購入</span>
        </a>


        <a
            href="mypage.html"
            class="nav-item active"
        >
            <span class="nav-icon">♙</span>
            <span>マイページ</span>
        </a>

    </nav>


    <!-- JavaScript -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase.js"></script>

    <script src="script.js"></script>


    <script>

        console.log(
            "★★★★★ mypageチェックコードが読み込まれた ★★★★★"
        );


        async function checkStripeConnectAccount() {

            console.log(
                "Stripe Connect状態を確認します"
            );


            const {
                data,
                error
            } =
                await supabaseClient.functions.invoke(
                    "check-connect-account",
                    {
                        body: {}
                    }
                );


            if (error) {

                console.error(
                    "Stripe Connect確認エラー:",
                    error
                );

                return;

            }


            console.log(
                "Stripe Connect確認結果:",
                data
            );

        }


        checkStripeConnectAccount();

    </script>


</body>

</html>
