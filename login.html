<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ログイン - EduMarket</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>
<nav class="site-nav">

    <a href="index.html">
        EduMarket
    </a>

    <a href="materials.html">
        教材を探す
    </a>

    <a href="mypage.html">
        マイページ
    </a>

</nav>
    <header>

        <h1>EduMarket</h1>

        <p>
            先生が作った教材を、必要な人へ。
        </p>

    </header>


    <main>

        <section class="auth-section">

            <h2>ログイン</h2>


            <form id="login-form">


                <div class="form-group">

                    <label for="login-email">
                        メールアドレス
                    </label>

                    <input
                        type="email"
                        id="login-email"
                        placeholder="example@email.com"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="login-password">
                        パスワード
                    </label>

                    <input
                        type="password"
                        id="login-password"
                        placeholder="パスワードを入力"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="submit-button"
                >
                    ログイン
                </button>


            </form>


            <p class="auth-link">

                アカウントをお持ちでないですか？

                <a href="register.html">
                    会員登録
                </a>

            </p>


        </section>

    </main>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="script.js"></script>

</body>

</html>
