<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>購入履歴 - EduMarket</title>


<style>

/* =====================
   基本設定
===================== */

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans JP",
    sans-serif;

  background: #f5f7fb;

  color: #14213d;

  padding-bottom: 90px;

}


/* =====================
   ヘッダー
===================== */

.header {

  background: #102344;

  color: white;

  padding:
    28px
    18px
    30px;

}

.logo {

  font-size: 28px;

  font-weight: 800;

  letter-spacing: -1px;

}

.subtitle {

  margin-top: 7px;

  font-size: 14px;

  color: #d9e1ef;

}


/* =====================
   メイン
===================== */

.main {

  padding:
    22px
    14px;

}


.title {

  font-size: 25px;

  font-weight: 800;

  margin-bottom: 18px;

}


/* =====================
   購入一覧
===================== */

.purchase-list {

  display: flex;

  flex-direction: column;

  gap: 14px;

}


/* =====================
   購入カード
===================== */

.purchase-card {

  background: white;

  border-radius: 16px;

  padding: 17px;

  box-shadow:
    0 3px 12px
    rgba(
      20,
      33,
      61,
      0.08
    );

}


/* カテゴリー */

.purchase-category {

  display: inline-block;

  background: #edf1f7;

  color: #53627b;

  padding:
    5px
    10px;

  border-radius: 20px;

  font-size: 11px;

  font-weight: 700;

}


/* 教材タイトル */

.purchase-title {

  margin-top: 12px;

  font-size: 19px;

  font-weight: 800;

  line-height: 1.4;

}


/* 説明 */

.purchase-description {

  margin-top: 7px;

  font-size: 13px;

  line-height: 1.6;

  color: #68758a;

}


/* 購入価格 */

.purchase-price {

  margin-top: 14px;

  font-size: 14px;

  color: #68758a;

}


.purchase-price strong {

  margin-left: 5px;

  font-size: 19px;

  color: #102344;

}


/* =====================
   ボタン
===================== */

.purchase-actions {

  display: flex;

  gap: 8px;

  margin-top: 16px;

}


.purchase-button {

  flex: 1;

  display: flex;

  align-items: center;

  justify-content: center;

  text-decoration: none;

  height: 43px;

  border-radius: 10px;

  font-size: 13px;

  font-weight: 700;

}


/* 教材を見る */

.material-button {

  background: #102344;

  color: white;

}


/* PDFを見る */

.pdf-button {

  background: white;

  color: #102344;

  border:
    1px
    solid
    #d9e0ea;

}


/* =====================
   空の場合
===================== */

.empty {

  background: white;

  border-radius: 16px;

  padding:
    45px
    20px;

  text-align: center;

  color: #7c8799;

}


/* =====================
   下部ナビ
===================== */

.bottom-nav {

  position: fixed;

  left: 0;

  right: 0;

  bottom: 0;

  height: 70px;

  background: white;

  border-top:
    1px
    solid
    #e3e7ef;

  display: grid;

  grid-template-columns:
    repeat(5, 1fr);

  z-index: 999;

  padding-bottom:
    env(safe-area-inset-bottom);

}


.nav-item {

  display: flex;

  flex-direction: column;

  align-items: center;

  justify-content: center;

  gap: 4px;

  text-decoration: none;

  color: #7c8799;

  font-size: 10px;

  font-weight: 600;

}


.nav-icon {

  font-size: 21px;

  line-height: 1;

}


.nav-item.active {

  color: #102344;

}


/* =====================
   PC
===================== */

@media (min-width: 700px) {

  body {

    max-width: 520px;

    margin: auto;

  }


  .bottom-nav {

    max-width: 520px;

    left: 50%;

    transform:
      translateX(-50%);

  }

}

</style>

</head>


<body>


<!-- =====================
     ヘッダー
===================== -->

<header class="header">

  <div class="logo">
    EduMarket
  </div>

  <div class="subtitle">
    購入した教材をいつでも確認できます。
  </div>

</header>



<!-- =====================
     メイン
===================== -->

<main class="main">

  <h1 class="title">
    購入履歴
  </h1>


 <div
  class="purchase-list"
  id="purchased-material-list"
>

    <div class="empty">
      購入履歴を読み込んでいます...
    </div>

  </div>

</main>



<!-- =====================
     下部ナビ
===================== -->

<nav class="bottom-nav">


  <a
    href="index.html"
    class="nav-item"
  >

    <span class="nav-icon">⌂</span>

    <span>ホーム</span>

  </a>



  <a
    href="materials.html"
    class="nav-item"
  >

    <span class="nav-icon">⌕</span>

    <span>探す</span>

  </a>



  <a
    href="sell.html"
    class="nav-item"
  >

    <span class="nav-icon">＋</span>

    <span>出品</span>

  </a>



  <a
    href="purchases.html"
    class="nav-item active"
  >

    <span class="nav-icon">🛒</span>

    <span>購入</span>

  </a>



  <a
    href="mypage.html"
    class="nav-item"
  >

    <span class="nav-icon">♙</span>

    <span>マイページ</span>

  </a>


</nav>



<!-- =====================
     Supabase
===================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>

<script src="script.js"></script>


</body>

</html>
