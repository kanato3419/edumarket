<!DOCTYPE html>

<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        プロフィール編集 - EduMarket
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <main class="mypage-main">


        <a
            href="mypage.html"
            class="back-link"
        >
            ← マイページに戻る
        </a>


        <h2 class="mypage-title">
            プロフィール編集
        </h2>


        <section class="profile-edit-card">


            <form
                id="profile-edit-form"
            >


                <!-- アイコン -->

                <div class="profile-image-edit">

                    <div
                        id="profile-image-preview"
                        class="profile-image-preview"
                    >
                        👤
                    </div>


                    <label
                        for="profile-image"
                        class="image-select-button"
                    >
                        アイコンを変更
                    </label>


                    <input
                        type="file"
                        id="profile-image"
                        accept="image/*"
                        hidden
                    >

                </div>


                <!-- ニックネーム -->

                <div class="form-group">

                    <label
                        for="profile-nickname"
                    >
                        ニックネーム
                    </label>


                    <input
                        type="text"
                        id="profile-nickname"
                        placeholder="例：太郎先生"
                        required
                    >

                </div>


                <!-- 保存 -->

                <button
                    type="submit"
                    class="submit-button"
                >
                    保存する
                </button>


            </form>


        </section>


    </main>


    <!-- 下部ナビ -->

    <nav class="bottom-nav">

        <a
            href="index.html"
            class="nav-item"
        >
            <span class="nav-icon">⌂</span>
            <span>ホーム</span>
        </a>


        <a
            href="materials.html"
            class="nav-item"
        >
            <span class="nav-icon">⌕</span>
            <span>探す</span>
        </a>


        <a
            href="sell.html"
            class="nav-item"
        >
            <span class="nav-icon">＋</span>
            <span>出品</span>
        </a>


        <a
            href="purchases.html"
            class="nav-item"
        >
            <span class="nav-icon">🛒</span>
            <span>購入</span>
        </a>


        <a
            href="mypage.html"
            class="nav-item active"
        >
            <span class="nav-icon">♙</span>
            <span>マイページ</span>
        </a>

    </nav>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase.js"></script>

    <script src="script.js"></script>


</body>

</html>
