<!DOCTYPE html>

<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        教材を編集 - EduMarket
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- PC用ナビ -->

    <nav class="site-nav">

        <a href="index.html">
            EduMarket
        </a>

        <a href="materials.html">
            教材を探す
        </a>

        <a href="mypage.html">
            マイページ
        </a>

    </nav>


    <header>

        <h1>
            EduMarket
        </h1>

        <p>
            先生が作った教材を、必要な人へ。
        </p>

    </header>


    <main class="edit-page-main">


        <!-- 戻る -->

        <a
            href="mypage.html"
            class="back-link"
        >
            ← マイページに戻る
        </a>


        <!-- タイトル -->

        <div class="edit-page-heading">

            <p class="edit-page-label">
                MATERIAL EDIT
            </p>

            <h2>
                教材を編集
            </h2>

            <p>
                教材の情報を変更できます
            </p>

        </div>


        <!-- 編集カード -->

        <section class="edit-material-card">


            <form id="edit-material-form">


                <!-- ================= -->
                <!-- 教材画像 -->
                <!-- ================= -->

                <div class="form-group">

                    <label>
                        教材画像
                    </label>


                    <!-- 現在の画像 -->

                    <div
                        id="edit-image-preview"
                        class="edit-image-preview"
                    >

                        <div class="edit-image-placeholder">
                            📚
                            <span>
                                画像を読み込んでいます
                            </span>
                        </div>

                    </div>


                    <!-- 画像選択 -->

                    <label
                        for="edit-image"
                        class="image-select-button"
                    >
                        画像を変更する
                    </label>


                    <input
                        type="file"
                        id="edit-image"
                        accept="image/*"
                        hidden
                    >


                    <p class="form-help">
                        PNG・JPGなどの画像を変更できます
                    </p>

                </div>


                <!-- ================= -->
                <!-- タイトル -->
                <!-- ================= -->

                <div class="form-group">

                    <label for="title">
                        教材タイトル
                    </label>

                    <input
                        type="text"
                        id="title"
                        required
                    >

                </div>


                <!-- ================= -->
                <!-- カテゴリー -->
                <!-- ================= -->

                <div class="form-group">

                    <label for="category">
                        カテゴリー
                    </label>

                    <select
                        id="category"
                        required
                    >

                        <option value="数学">
                            数学
                        </option>

                        <option value="英語">
                            英語
                        </option>

                        <option value="国語">
                            国語
                        </option>

                        <option value="理科">
                            理科
                        </option>

                        <option value="社会">
                            社会
                        </option>

                    </select>

                </div>


                <!-- ================= -->
                <!-- 対象 -->
                <!-- ================= -->

                <div class="form-group">

                    <label for="target">
                        対象
                    </label>

                    <input
                        type="text"
                        id="target"
                        placeholder="例：中学1年生"
                        required
                    >

                </div>


                <!-- ================= -->
                <!-- 説明 -->
                <!-- ================= -->

                <div class="form-group">

                    <label for="description">
                        教材の説明
                    </label>

                    <textarea
                        id="description"
                        rows="7"
                        required
                    ></textarea>

                </div>


                <!-- ================= -->
                <!-- 価格 -->
                <!-- ================= -->

                <div class="form-group">

                    <label for="price">
                        価格
                    </label>


                    <div class="price-input-wrap">

                        <span>
                            ¥
                        </span>

                        <input
                            type="number"
                            id="price"
                            min="0"
                            required
                        >

                    </div>

                </div>


                <!-- 保存 -->

                <button
                    type="submit"
                    class="edit-save-button"
                >
                    変更を保存する
                </button>


            </form>


        </section>


    </main>


    <!-- 下部ナビ -->

    <nav class="bottom-nav">


        <a
            href="index.html"
            class="nav-item"
        >
            <span class="nav-icon">
                ⌂
            </span>

            <span>
                ホーム
            </span>
        </a>


        <a
            href="materials.html"
            class="nav-item"
        >
            <span class="nav-icon">
                ⌕
            </span>

            <span>
                探す
            </span>
        </a>


        <a
            href="sell.html"
            class="nav-item"
        >
            <span class="nav-icon">
                ＋
            </span>

            <span>
                出品
            </span>
        </a>


        <a
            href="purchases.html"
            class="nav-item"
        >
            <span class="nav-icon">
                🛒
            </span>

            <span>
                購入
            </span>
        </a>


        <a
            href="mypage.html"
            class="nav-item active"
        >
            <span class="nav-icon">
                ♙
            </span>

            <span>
                マイページ
            </span>
        </a>


    </nav>


    <!-- Supabase -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase.js"></script>

    <script src="script.js"></script>


</body>

</html>
